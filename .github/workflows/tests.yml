name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only wheels: the test suite doesn't need a GPU build, and the
          # default PyPI wheels would pull much larger CUDA builds.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          # Model-specific deps requirements.txt intentionally excludes (see its
          # header comment), but tests/test_covid_cxr.py needs them to import
          # src/datasets/covid_cxr.py -- same reasoning as the torch install above:
          # a CI-only concern, not something every notebook's local env needs.
          pip install pandas scikit-learn Pillow
          # tests/test_model_assembly.py needs timm to build DenseNet121/ResNet50
          # (pretrained=False everywhere in tests, so no network weight download).
          pip install timm
          # tests/test_gradcam.py needs pytorch_grad_cam -- already used successfully
          # on Kaggle by notebooks/candidate-c-grad-cam-shortcut-suppression-loss.ipynb.
          pip install grad-cam
          # src/modules/training.py (tests/test_training.py) needs tqdm for its
          # progress bars -- explicit here rather than relying on it arriving as
          # some other package's transitive dependency.
          pip install tqdm

      - name: Run tests
        run: pytest -v
