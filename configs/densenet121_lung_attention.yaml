# T18 -- Lung-Region Attention Module (Candidate A) on DenseNet121.
#
# Copied from baseline.yaml per configs/README.md; the `training` block is
# extended for two-phase transfer learning (phase1_* / phase2_*) since a
# single flat epochs/learning_rate pair can't express the frozen -> fine-tune
# schedule every architecture in this project actually uses.
#
# This file represents arm A2 (the full module: gate on, guidance on).
# Other T18 arms (A0/A1/A4/A5) are produced from this file at run time via
# merge_overrides() -- see notebooks/T18_lung_region_attention.ipynb S1 and
# the Claude Working Files/T18_Lung_Region_Attention_WBS.md arm->flags table
# (Appendix A.3). Do not fork a separate YAML per arm; that would let the
# arms drift out of sync, which is exactly what the ablation must not do.
#
# Do NOT put API keys, tokens, or credentials in this file -- W&B
# authentication is handled separately (see docs/wandb_setup.md).

experiment:
  name: T18_lung_attention
  seed: 42

model:
  name: densenet121
  pretrained: true
  num_classes: 4
  # T13 (Member 2's DenseNet121 HPO, notebooks/DenseNet_HPO_train.ipynb, Optuna
  # trial 9/20, best val_loss 0.2354) winner. Passed as timm's head drop_rate --
  # WBS section 4.3 requires A0/A2 share "the same head, same pooling, same
  # dropout" as Member 2's vanilla baseline, or the comparison has a confound.
  # Adds zero parameters, so this doesn't affect the A6 cost acceptance criterion.
  drop_rate: 0.430365

module:
  # T18-specific block. Not present in baseline.yaml -- this is the module
  # under study. See WBS section 3.2 for the formal definition.
  name: lung_region_attention
  attention: lung # lung (ours, Appendix A.2) | cbam (arm A5, Appendix A.4b)
  use_attention: true # false selects arm A0 (vanilla control)
  in_channels: 1024 # DenseNet121 forward_features() channel count
  reduction: 8 # bottleneck ratio -> 128 hidden channels, 131,329 added params
  gate_mode: residual # residual (ours) | multiply (arm A3) | none (arm A4)
  target_mode: soft # soft (area-pooled mask, WBS 4.4) | hard (thresholded)
  lambda_att: 0.5 # placeholder -- overwritten by the S9 lambda-sweep selection
  # Background-suppression loss weight, opt-in -- NOT part of the frozen
  # A0-A5 ablation (every arm uses 0.0, so this config still represents
  # arm A2 exactly as originally specified). Set > 0.0 only for a separate
  # follow-up run (e.g. "A2+bg") testing whether directly penalizing
  # background attention mass improves shortcut suppression beyond
  # guidance-loss alone. See src/modules/lung_attention.py::background_suppression_loss.
  lambda_bg: 0.0

dataset:
  name: covid19_radiography
  version: v1
  image_size: 224
  split_version: v1 # -> artifacts/splits/split_manifest_v1.csv (this task, S1 step 5)
  use_masks: true # loads (image, label, mask) triples via JointTransform + CXRWithMaskDataset

training:
  # Two-phase schedule (frozen backbone -> fine-tune final block), replacing
  # baseline.yaml's flat epochs/learning_rate pair.
  #
  # WBS section 3.4a decision order: "If Member 2's T13 (DenseNet HP tuning)
  # has a winner -> use it" -- it now does. notebooks/DenseNet_HPO_train.ipynb
  # ran a 20-trial Optuna search (TPE sampler, MedianPruner) directly on
  # DenseNet121 and retrained trial 9's winning config at the full epoch
  # budget: 94.83% test accuracy, macro-F1 0.9505, macro ROC-AUC 0.9928
  # (see that notebook's final cells). This replaces the previous inherited
  # default (T16's EfficientNet-B0 sweep winner, kept only because T13 hadn't
  # landed yet -- see artifacts/efficientnet_b0/runs/T16_efficientnet_b0/
  # tuning_summary.csv for that superseded value).
  #
  # optimizer/scheduler/unfreeze_blocks/batch_size are adopted from the same
  # trial (not just phase*_lr/weight_decay) per the WBS's "use it" directive --
  # every T18 arm must share Member 2's exact tuned config, not a partial
  # subset of it, or the A0-vs-A2 comparison isn't testing against the same
  # baseline the paper's Table 2 baseline row reports.
  phase1_epochs: 15
  phase1_lr: 0.00412 # ~4.12e-3 -- T13 winner (was 3e-4, T16-inherited)
  phase2_epochs: 40
  phase2_lr: 0.000062 # ~6.2e-5 -- T13 winner (was 3e-5, T16-inherited)
  unfreeze_blocks: 3 # denseblock4/3/2 + transition2/3 + norm5 -- T13 winner (was 1)
  batch_size: 64 # T13 winner (was 32)
  optimizer: adam # T13 winner -- NOT adamw (was adamw)
  weight_decay: 0.0000187 # ~1.87e-5 -- T13 winner (was 1e-3)
  patience: 5 # early stopping patience, monitored on val_loss

scheduler:
  name: plateau # T13 winner -- NOT cosine (was cosine); see build_scheduler's ReduceLROnPlateau branch

augmentation:
  # Distinct from baseline_v1: JointTransform applies identical spatial ops
  # (resize/pad/crop/flip/rotate) to image AND mask together, in a different
  # order than build_transforms' image-only pipeline (WBS section 4.6/4.8).
  # Bump this again if JointTransform's implementation changes.
  version: joint_v1

tracking:
  provider: wandb
  project: chest-xray-disease-classification
  entity: null
  mode: null # override at call time: "offline" or "disabled" for S7 smoke tests

checkpoint:
  # NOTE: baseline.yaml declares monitor: val_f1 / mode: max, but every
  # existing team notebook (T12/T14/T16/T19) early-stops on val_loss instead
  # -- a pre-existing policy/code mismatch (WBS gap G7), not something T18
  # introduced. Kept as val_loss here so A0 stays comparable to the rest of
  # the team's runs; best_val_f1 is still logged in the training loop
  # (WBS section S6) so it's available even though it isn't the stopping
  # criterion.
  monitor: val_loss
  mode: min
  dir: artifacts/T18_lung_attention/runs
